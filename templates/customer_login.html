<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In | FuelFlow Pro</title><link rel="stylesheet" href="{{ url_for('static', filename='customer.css') }}"></head>
<body><main class="auth-shell"><section class="card auth-card"><a class="brand" href="/customer-login"><span class="brand-mark">⛽</span>FuelFlow Pro</a><h1>Welcome back</h1><p class="subtitle">Sign in to manage your fuel tokens.</p><div id="message" class="message" role="status"></div><form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" placeholder="Enter username" required></div><div class="field password-field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required><button type="button" class="toggle-password" aria-label="Show password">◉</button></div><button id="loginButton" class="button full" type="submit">Sign In</button></form><p class="auth-foot"><a href="/customer-forgot-password">Forgot password?</a></p><p class="auth-foot">New to FuelFlow Pro? <a href="/customer-register">Create an account</a></p></section></main>
<script>
const message=document.getElementById("message");function show(text){message.textContent=text;message.className="message error";}document.querySelector(".toggle-password").addEventListener("click",()=>{password.type=password.type==="password"?"text":"password";});document.getElementById("loginForm").addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("loginButton");button.disabled=true;button.textContent="Signing in…";try{const response=await fetch("/api/customer/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to sign in.");window.location.href="/customer-dashboard";}catch(error){show(error.message||"Unable to connect to the server.");button.disabled=false;button.textContent="Sign In";}});
</script></body></html>
