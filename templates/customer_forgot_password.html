<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password | FuelFlow Pro</title><link rel="stylesheet" href="{{ url_for('static', filename='customer.css') }}"></head>
<body><main class="auth-shell"><section class="card auth-card"><a class="brand" href="/customer-login"><span class="brand-mark">⛽</span>FuelFlow Pro</a><h1>Reset password</h1><p class="subtitle">Enter your registered mobile number to receive a 6-digit OTP.</p><div id="message" class="message" role="status"></div><form id="requestForm"><div class="field"><label for="phone">Mobile Number</label><input id="phone" type="tel" maxlength="16" autocomplete="tel" placeholder="+919876543210" required></div><button id="sendButton" class="button full" type="submit">Send OTP</button></form><form id="resetForm" hidden><div class="field"><label for="otp">OTP</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit OTP" required></div><div class="field"><label for="newPassword">New Password</label><input id="newPassword" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" minlength="8" maxlength="256" autocomplete="new-password" required></div><button id="resetButton" class="button full" type="submit">Reset Password</button></form><p class="auth-foot"><a href="/customer-login">Back to sign in</a></p></section></main>
<script>const message=document.getElementById("message"),requestForm=document.getElementById("requestForm"),resetForm=document.getElementById("resetForm");function show(text,type="error"){message.textContent=text;message.className="message "+type;}function checks(value){const e=[];if(value.length<8)e.push("at least 8 characters");if(!/[A-Z]/.test(value))e.push("one uppercase letter");if(!/[0-9]/.test(value))e.push("one number");if(!/[^A-Za-z0-9\s]/.test(value))e.push("one special symbol");return e;}requestForm.addEventListener("submit",async e=>{e.preventDefault();sendButton.disabled=true;try{const r=await fetch("/api/customer/password-reset/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:phone.value})}),d=await r.json();if(!r.ok)throw new Error(d.error);show(d.message,"success");resetForm.hidden=false;}catch(err){show(err.message||"Could not send OTP.");}finally{sendButton.disabled=false;}});resetForm.addEventListener("submit",async e=>{e.preventDefault();if(newPassword.value!==confirmPassword.value)return show("New passwords do not match.");const errors=checks(newPassword.value);if(errors.length)return show("Password must include "+errors.join("; ")+".");resetButton.disabled=true;try{const r=await fetch("/api/customer/password-reset/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:phone.value,otp:otp.value,new_password:newPassword.value,confirm_password:confirmPassword.value})}),d=await r.json();if(!r.ok)throw new Error(d.error);show(d.message,"success");setTimeout(()=>location.href="/customer-login",1200);}catch(err){show(err.message||"Could not reset password.");}finally{resetButton.disabled=false;}});</script></body></html>
