<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>History | FuelFlow Pro</title><link rel="stylesheet" href="{{ url_for('static', filename='customer.css') }}"></head>
<body><div class="app-shell"><header class="topbar"><a class="brand" href="/customer-dashboard"><span class="brand-mark">⛽</span>FuelFlow Pro</a><div class="topbar-actions"><a class="icon-button" href="/customer-support" aria-label="Help">?</a><a class="icon-button" href="/customer-logout" aria-label="Logout">↪</a></div></header>
<main class="page"><p class="eyebrow">Your refueling record</p><h1>Transaction History</h1><p class="muted">Find your fuel tokens and completed refueling activity.</p><section class="section"><div class="filter-row"><input id="searchInput" type="search" placeholder="Search vehicle or token"><select id="statusFilter"><option value="">All statuses</option><option value="WAITING">Waiting</option><option value="AUTHORIZED">Authorized</option><option value="EXPIRED">Completed</option></select><input id="dateFilter" type="date" aria-label="Filter by date"></div><div id="historyList" class="history-list"><div class="card empty-state"><div class="empty-icon">◌</div><p>Loading your history…</p></div></div></section></main>
<nav class="bottom-nav" aria-label="Customer navigation"><a href="/customer-dashboard"><span class="nav-icon">⌂</span>Home</a><a href="/customer-tokens"><span class="nav-icon">▦</span>Tokens</a><a class="active" href="/customer-history"><span class="nav-icon">◷</span>History</a><a href="/customer-profile"><span class="nav-icon">◉</span>Profile</a></nav></div>
<script>
let transactions=[];const list=document.getElementById("historyList");
function money(value){return "₹"+Number(value||0).toLocaleString("en-IN",{maximumFractionDigits:2});}function date(value){if(!value)return "—";const parsed=new Date(value);return Number.isNaN(parsed.getTime())?value:parsed.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});}function badge(status){const node=document.createElement("span");node.className="badge badge-"+String(status||"UNKNOWN").toUpperCase().replace(/[^A-Z0-9_-]/g,"");node.textContent=status||"UNKNOWN";return node;}
function render(){const query=document.getElementById("searchInput").value.trim().toLowerCase(),status=document.getElementById("statusFilter").value,selectedDate=document.getElementById("dateFilter").value;const filtered=transactions.filter(item=>{const haystack=[item.token_code,item.vehicle_number,item.fuel_type].join(" ").toLowerCase();const timestamp=item.transaction_completed_at||item.completed_at||item.created_at;const recordDate=timestamp?String(timestamp).slice(0,10):"";return(!query||haystack.includes(query))&&(!status||item.status===status)&&(!selectedDate||recordDate===selectedDate);});list.replaceChildren();if(!filtered.length){list.innerHTML='<div class="card empty-state"><div class="empty-icon">◌</div><h3>No matching activity</h3><p>Try a different search, or create a fuel token to get started.</p></div>';return;}filtered.forEach(item=>{const card=document.createElement("article");card.className="card history-item";const head=document.createElement("div");head.className="history-head";const name=document.createElement("strong");name.textContent=(item.fuel_type||"Fuel")+" · "+money(item.amount);head.append(name,badge(item.status));const meta=document.createElement("div");meta.className="history-meta";[["Token "+(item.token_code||"—")],[item.vehicle_number||"Vehicle pending"],[item.pump_number?"Pump "+item.pump_number:"Pump pending"],[date(item.transaction_completed_at||item.completed_at||item.created_at)]].forEach(parts=>{const span=document.createElement("span");span.textContent=parts[0];meta.appendChild(span);});card.append(head,meta);list.appendChild(card);});}
async function load(){try{const response=await fetch("/api/customer/transactions");if(response.status===401){window.location.href="/customer-login";return;}const data=await response.json();if(!response.ok)throw new Error();transactions=Array.isArray(data)?data:[];render();}catch(error){list.innerHTML='<div class="card empty-state"><div class="empty-icon">!</div><p>Could not load your history. Please refresh and try again.</p></div>';}}
document.getElementById("searchInput").addEventListener("input",render);document.getElementById("statusFilter").addEventListener("change",render);document.getElementById("dateFilter").addEventListener("change",render);load();
</script></body></html>
