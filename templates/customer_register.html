<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | FuelFlow Pro</title><link rel="stylesheet" href="{{ url_for('static', filename='customer.css') }}"></head>
<body><main class="auth-shell"><section class="card auth-card"><a class="brand" href="/customer-login"><span class="brand-mark">⛽</span>FuelFlow Pro</a><h1>Create your account</h1><p class="subtitle">Start managing fuel tokens in a few taps.</p><div id="message" class="message" role="status"></div><form id="registerForm"><div class="field"><label for="username">Username</label><input id="username" minlength="3" maxlength="50" autocomplete="username" placeholder="Choose a username" required></div><div class="field password-field"><label for="password">Password</label><input id="password" type="password" minlength="8" maxlength="256" autocomplete="new-password" placeholder="Create a password" required><button class="toggle-password" type="button" data-target="password" aria-label="Show password">◉</button></div><ul class="requirements"><li>At least 8 characters</li><li>One uppercase letter, one number, and one special symbol</li></ul><div class="field password-field"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" minlength="8" maxlength="256" autocomplete="new-password" placeholder="Confirm password" required><button class="toggle-password" type="button" data-target="confirmPassword" aria-label="Show password">◉</button></div><button id="registerButton" class="button full" type="submit">Create Account</button></form><p class="auth-foot">Already have an account? <a href="/customer-login">Sign in</a></p></section></main>
<script>
const message=document.getElementById("message");function show(text){message.textContent=text;message.className="message error";}function requirements(value){const errors=[];if(value.length<8)errors.push("at least 8 characters");if(!/[A-Z]/.test(value))errors.push("one uppercase letter");if(!/[0-9]/.test(value))errors.push("one number");if(!/[^A-Za-z0-9\s]/.test(value))errors.push("one special symbol");return errors;}document.querySelectorAll(".toggle-password").forEach(button=>button.addEventListener("click",()=>{const input=document.getElementById(button.dataset.target);input.type=input.type==="password"?"text":"password";}));document.getElementById("registerForm").addEventListener("submit",async event=>{event.preventDefault();if(password.value!==confirmPassword.value){show("Passwords do not match.");return;}const errors=requirements(password.value);if(errors.length){show("Password must include "+errors.join("; ")+".");return;}const button=document.getElementById("registerButton");button.disabled=true;button.textContent="Creating account…";try{const response=await fetch("/api/customer/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Registration failed.");window.location.href="/customer-dashboard";}catch(error){show(error.message||"Unable to connect to the server.");button.disabled=false;button.textContent="Create Account";}});
</script></body></html>
