<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | FuelFlow Pro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #0f5132;
            color: white;
            padding: 20px 40px;
            text-align: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .tagline {
            margin-top: 5px;
            font-size: 14px;
            opacity: 0.9;
        }

        .register-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .register-card h1 {
            color: #0f5132;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0f5132;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0f5132;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0b3d26;
        }

        .error {
            display: none;
            background: #f8d7da;
            color: #842029;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .login-text {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .login-text a {
            color: #0f5132;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
            }

            .register-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">FuelFlow Pro</div>
        <div class="tagline">Smart Petrol Pump Management System</div>
    </header>

    <div class="register-container">
        <div class="register-card">
            <h1>Create Account</h1>
            <p class="subtitle">Register as a FuelFlow Pro customer</p>

            <div id="errorMessage" class="error"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Create username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >
                </div>

                <button type="submit">Register</button>
            </form>

            <div class="login-text">
                Already have an account?
                <a href="/customer-login">Login</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const errorMessage = document.getElementById("errorMessage");

            errorMessage.style.display = "none";

            if (password !== confirmPassword) {
                errorMessage.textContent = "Passwords do not match";
                errorMessage.style.display = "block";
                return;
            }

            try {
                const response = await fetch("/api/customer/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorMessage.textContent = data.error || "Registration failed";
                    errorMessage.style.display = "block";
                    return;
                }

                window.location.href = "/customer-dashboard";

            } catch (error) {
                errorMessage.textContent = "Unable to connect to the server";
                errorMessage.style.display = "block";
            }
        });
    </script>

</body>
</html>
