
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tokens | FuelFlow Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='customer.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        .token-status-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin: 14px 0;
        }

        .status-summary-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 14px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: var(--card-background, #fff);
        }

        .status-summary-item span {
            color: #6b7280;
            font-size: 0.85rem;
        }

        .status-summary-item strong {
            font-size: 1.4rem;
        }

        /* Token accordion */
        .token-card {
            overflow: hidden;
            padding: 0 !important;
            margin-bottom: 14px;
        }

        .token-accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 20px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .token-accordion-header:hover {
            background: rgba(148, 163, 184, 0.07);
        }

        .token-main-info {
            flex: 1;
            min-width: 0;
        }

        .token-code {
            font-size: 1.15rem;
            font-weight: 800;
            margin-top: 7px;
            overflow-wrap: anywhere;
        }

        .token-summary-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 9px;
            margin-top: 10px;
        }

        .token-summary-chip {
            padding: 6px 10px;
            background: #f3f6f9;
            border-radius: 7px;
            color: #334155;
            font-size: 0.84rem;
            font-weight: 600;
        }

        .token-header-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .token-expand-button {
            width: 38px;
            height: 38px;
            border: 1px solid #e2e8f0;
            border-radius: 50%;
            background: #f8fafc;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.25s ease, background 0.2s ease;
        }

        .token-expand-button:hover {
            background: #eaf0f6;
        }

        .token-expand-button svg {
            width: 19px;
            height: 19px;
            transition: transform 0.3s ease;
        }

        .token-card.expanded .token-expand-button svg {
            transform: rotate(180deg);
        }

        .token-details-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows 0.3s ease, opacity 0.25s ease;
        }

        .token-card.expanded .token-details-wrapper {
            grid-template-rows: 1fr;
            opacity: 1;
        }

        .token-details-inner {
            overflow: hidden;
            min-height: 0;
        }

        .token-details {
            padding: 18px 20px 20px;
            border-top: 1px solid #e5e7eb;
        }

        .token-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .token-meta > div {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 13px;
            border-radius: 12px;
            background: #f5f7f9;
            min-width: 0;
        }

        .token-meta small {
            color: #64748b;
            font-size: 0.8rem;
        }

        .token-meta strong {
            color: #102a43;
            font-size: 0.98rem;
            overflow-wrap: anywhere;
        }

        .token-expiry {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .token-expiry.warning {
            background: #fff7ed;
            color: #c2410c;
        }

        .token-expiry.expired {
            background: #fef2f2;
            color: #b91c1c;
        }

        .token-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .token-actions button {
            cursor: pointer;
        }

        .qr-panel {
            margin-top: 15px;
            padding: 18px;
            border-radius: 12px;
            background: #f5f7f9;
            text-align: center;
        }

        .qr-panel.hidden {
            display: none;
        }

        .qr-panel canvas,
        .qr-panel img {
            display: block;
            margin: 14px auto;
            max-width: 100%;
        }

        .token-expand-button:focus-visible,
        .token-accordion-header:focus-visible {
            outline: 3px solid #0d9488;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .token-status-summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .token-accordion-header {
                padding: 16px;
                gap: 8px;
            }

            .token-header-right {
                gap: 8px;
            }

            .token-code {
                font-size: 1rem;
            }

            .token-summary-meta {
                gap: 6px;
            }

            .token-summary-chip {
                font-size: 0.78rem;
                padding: 5px 8px;
            }

            .token-details {
                padding: 15px;
            }

            .token-meta {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .token-expand-button {
                width: 34px;
                height: 34px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .token-details-wrapper,
            .token-expand-button,
            .token-expand-button svg {
                transition: none;
            }
        }
    </style>
</head>

<body>
<div class="app-shell">

    <header class="topbar">
        <a class="brand" href="/customer-dashboard">
            <span class="brand-mark">⛽</span>FuelFlow Pro
        </a>

        <div class="topbar-actions">
            <a class="icon-button" href="/customer-support" aria-label="Help">?</a>
            <a class="icon-button" href="/customer-logout" aria-label="Logout">↪</a>
        </div>
    </header>

    <main class="page">
        <p class="eyebrow">Fuel on your terms</p>
        <h1>My Fuel Tokens</h1>
        <p class="muted">Create a token, then show its QR code to the operator.</p>

        <section class="section card form-card">
            <h2>Create a fuel token</h2>
            <div id="formMessage" class="message" role="status"></div>

            <form id="tokenForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="vehicleNumber">Vehicle Number</label>
                        <input id="vehicleNumber" placeholder="Example: MH20AB1234" required>
                    </div>

                    <div class="field">
                        <label for="fuelType">Fuel Type</label>
                        <select id="fuelType" required>
                            <option value="">Select fuel type</option>
                            <option value="PETROL">PETROL</option>
                            <option value="DIESEL">DIESEL</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="amount">Amount (₹)</label>
                    <input id="amount" type="number" min="1" step="0.01"
                           placeholder="Enter amount" required>
                </div>

                <button id="generateButton" class="button full" type="submit">
                    Generate Fuel Token
                </button>
            </form>
        </section>

        <section class="section">
            <div class="section-heading">
                <h2>Your Tokens</h2>
                <button class="text-button" id="refreshButton">Refresh</button>
            </div>

            <div class="token-toolbar">
                <span id="tokenCount" class="token-count">Loading tokens…</span>

                <select id="tokenStatusFilter" aria-label="Filter tokens by status">
                    <option value="">All statuses</option>
                    <option value="ACTIVE">Active</option>
                    <option value="USED">Used</option>
                    <option value="CANCELLED">Cancelled</option>
                    <option value="EXPIRED">Expired</option>
                </select>
            </div>

            <div class="token-status-summary" id="tokenStatusSummary"
                 aria-label="Token status summary">

                <div class="status-summary-item">
                    <span>Active</span>
                    <strong id="activeTokenCount">0</strong>
                </div>

                <div class="status-summary-item">
                    <span>Used</span>
                    <strong id="usedTokenCount">0</strong>
                </div>

                <div class="status-summary-item">
                    <span>Cancelled</span>
                    <strong id="cancelledTokenCount">0</strong>
                </div>

                <div class="status-summary-item">
                    <span>Expired</span>
                    <strong id="expiredTokenCount">0</strong>
                </div>
            </div>

            <div id="tokenList" class="token-list"></div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Customer navigation">
        <a href="/customer-dashboard"><span class="nav-icon">⌂</span>Home</a>
        <a class="active" href="/customer-tokens"><span class="nav-icon">▦</span>Tokens</a>
        <a href="/customer-history"><span class="nav-icon">◷</span>History</a>
        <a href="/customer-profile"><span class="nav-icon">◉</span>Profile</a>
    </nav>

</div>

<script>
const vehicleInput = document.getElementById("vehicleNumber");
const vehicleField = vehicleInput.closest(".field");

const savedVehicleField = document.createElement("div");
const savedVehicleLabel = document.createElement("label");
const savedVehicleSelect = document.createElement("select");

savedVehicleField.className = "field";
savedVehicleLabel.htmlFor = "savedVehicle";
savedVehicleLabel.textContent = "Saved Vehicles";
savedVehicleSelect.id = "savedVehicle";
savedVehicleSelect.innerHTML =
    '<option value="">Type a new vehicle below</option>';

savedVehicleField.append(savedVehicleLabel, savedVehicleSelect);
vehicleField.parentNode.insertBefore(savedVehicleField, vehicleField);

savedVehicleSelect.addEventListener("change", () => {
    if (savedVehicleSelect.value) {
        vehicleInput.value = savedVehicleSelect.value;
    }
});

async function loadSavedVehicles() {
    try {
        const response = await fetch("/api/customer/vehicles");

        if (!response.ok) return;

        const vehicles = await response.json();

        vehicles.forEach(vehicle => {
            const option = document.createElement("option");
            option.value = vehicle.vehicle_number;
            option.textContent = vehicle.vehicle_number;
            savedVehicleSelect.appendChild(option);
        });

    } catch (error) {
        // Saved vehicles are optional.
    }
}

loadSavedVehicles();
</script>

<script>
const list = document.getElementById("tokenList");
const messageBox = document.getElementById("formMessage");
const count = document.getElementById("tokenCount");
const filter = document.getElementById("tokenStatusFilter");

let tokens = [];

const money = value =>
    "₹" + Number(value || 0).toLocaleString("en-IN", {
        maximumFractionDigits: 2
    });

const date = value => {
    if (!value) return "—";

    const parsed = new Date(value);

    return Number.isNaN(parsed.getTime())
        ? value
        : parsed.toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short",
            year: "numeric"
        });
};

function getStatusInfo(status) {
    const normalized = String(status || "UNKNOWN").toUpperCase();

    const statusMap = {
        WAITING:    { label: "Active", category: "ACTIVE" },
        AUTHORIZED: { label: "Active", category: "ACTIVE" },
        ACTIVE:     { label: "Active", category: "ACTIVE" },
        COMPLETED:  { label: "Used", category: "USED" },
        USED:       { label: "Used", category: "USED" },
        CANCELLED:  { label: "Cancelled", category: "CANCELLED" },
        EXPIRED:    { label: "Expired", category: "EXPIRED" }
    };

    return statusMap[normalized] || {
        label: normalized.replaceAll("_", " "),
        category: normalized
    };
}

function getEffectiveStatus(token) {
    if (token.status === "WAITING" && token.expires_at) {
        const expiryTime = new Date(token.expires_at).getTime();

        if (!Number.isNaN(expiryTime) && expiryTime <= Date.now()) {
            return "EXPIRED";
        }
    }

    return token.status;
}

function getExpiryDisplay(token) {
    if (!token.expires_at) return null;

    const expiryTime = new Date(token.expires_at).getTime();

    if (Number.isNaN(expiryTime)) return null;

    const remaining = expiryTime - Date.now();

    if (remaining <= 0) {
        return {
            text: "Token expired",
            warning: false,
            expired: true
        };
    }

    const totalSeconds = Math.floor(remaining / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return {
        text: `Expires in ${hours}h ${minutes}m ${seconds}s`,
        warning: remaining <= 30 * 60 * 1000,
        expired: false
    };
}

function updateCountdowns() {
    let statusChanged = false;

    tokens.forEach(token => {
        if (token.status === "WAITING" && token.expires_at) {
            const expiryTime = new Date(token.expires_at).getTime();

            if (!Number.isNaN(expiryTime) && expiryTime <= Date.now()) {
                token.status = "EXPIRED";
                statusChanged = true;
            }
        }
    });

    if (statusChanged) {
        render();
        return;
    }

    document.querySelectorAll(".token-expiry[data-token-code]").forEach(element => {
        const token = tokens.find(
            item => item.token_code === element.dataset.tokenCode
        );

        if (!token) return;

        const info = getExpiryDisplay(token);

        if (!info) return;

        element.textContent = info.text;
        element.classList.toggle("warning", info.warning);
        element.classList.toggle("expired", info.expired);
    });
}

function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message " + type;
}

function makeBadge(status) {
    const info = getStatusInfo(status);
    const badge = document.createElement("span");

    badge.className = "badge badge-" + info.category;
    badge.textContent = info.label;

    return badge;
}

async function cancelToken(code) {
    if (!confirm(
        "Cancel this waiting fuel token? It cannot be scanned after cancellation."
    )) return;

    try {
        const response = await fetch(
            "/api/customer/tokens/" + encodeURIComponent(code) + "/cancel",
            { method: "POST" }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not cancel token.");
        }

        showMessage(data.message, "success");
        await loadTokens();

    } catch (error) {
        showMessage(error.message || "Could not cancel token.", "error");
    }
}

function card(token) {
    const item = document.createElement("article");
    const header = document.createElement("div");
    const mainInfo = document.createElement("div");
    const code = document.createElement("div");
    const summaryMeta = document.createElement("div");
    const headerRight = document.createElement("div");
    const expandButton = document.createElement("button");
    const detailsWrapper = document.createElement("div");
    const detailsInner = document.createElement("div");
    const details = document.createElement("div");
    const meta = document.createElement("div");
    const actions = document.createElement("div");

    item.className = "card token-card";

    // Compact visible header
    header.className = "token-accordion-header";
    header.setAttribute("role", "button");
    header.setAttribute("tabindex", "0");
    header.setAttribute("aria-expanded", "false");

    mainInfo.className = "token-main-info";

    const fuelLabel = document.createElement("small");
    fuelLabel.className = "muted";
    fuelLabel.textContent = "FUEL TOKEN";

    code.className = "token-code";
    code.textContent = token.token_code;

    mainInfo.append(fuelLabel, code);

    summaryMeta.className = "token-summary-meta";

    const fuelChip = document.createElement("span");
    fuelChip.className = "token-summary-chip";
    fuelChip.textContent = token.fuel_type || "—";

    const amountChip = document.createElement("span");
    amountChip.className = "token-summary-chip";
    amountChip.textContent = money(token.amount);

    summaryMeta.append(fuelChip, amountChip);
    mainInfo.appendChild(summaryMeta);

    headerRight.className = "token-header-right";

    headerRight.appendChild(makeBadge(getEffectiveStatus(token)));

    expandButton.type = "button";
    expandButton.className = "token-expand-button";
    expandButton.setAttribute("aria-label", "Expand token details");
    expandButton.setAttribute("aria-expanded", "false");

    expandButton.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
            <path d="m6 9 6 6 6-6"></path>
        </svg>
    `;

    headerRight.appendChild(expandButton);
    header.append(mainInfo, headerRight);

    // Expand and collapse behaviour
    function toggleDetails() {
        const expanded = item.classList.toggle("expanded");

        header.setAttribute("aria-expanded", String(expanded));
        expandButton.setAttribute("aria-expanded", String(expanded));

        expandButton.setAttribute(
            "aria-label",
            expanded ? "Collapse token details" : "Expand token details"
        );
    }

    expandButton.addEventListener("click", event => {
        event.stopPropagation();
        toggleDetails();
    });

    header.addEventListener("click", event => {
        if (event.target.closest("button")) return;
        toggleDetails();
    });

    header.addEventListener("keydown", event => {
        if (event.target !== header) return;

        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleDetails();
        }
    });

    // Expandable content
    detailsWrapper.className = "token-details-wrapper";
    detailsInner.className = "token-details-inner";
    details.className = "token-details";

    meta.className = "token-meta";

    [
        ["Vehicle", token.vehicle_number || "—"],
        ["Created", date(token.created_at)]
    ].forEach(([label, value]) => {
        const cell = document.createElement("div");

        const small = document.createElement("small");
        const strong = document.createElement("strong");

        small.textContent = label;
        strong.textContent = value;

        cell.append(small, strong);
        meta.appendChild(cell);
    });

    details.appendChild(meta);

    // Expiry countdown
    if (token.status === "WAITING" && token.expires_at) {
        const expiryElement = document.createElement("div");

        expiryElement.className = "token-expiry";
        expiryElement.dataset.tokenCode = token.token_code;

        const expiryInfo = getExpiryDisplay(token);

        if (expiryInfo) {
            expiryElement.textContent = expiryInfo.text;

            if (expiryInfo.warning) {
                expiryElement.classList.add("warning");
            }

            if (expiryInfo.expired) {
                expiryElement.classList.add("expired");
            }
        }

        details.appendChild(expiryElement);
    }

    // Existing QR and copy actions
    actions.className = "token-actions";

    const qrButton = document.createElement("button");
    const copyButton = document.createElement("button");
    const panel = document.createElement("div");
    const qr = document.createElement("div");

    qrButton.type = "button";
    qrButton.className = "text-button";
    qrButton.textContent = "View QR code";

    copyButton.type = "button";
    copyButton.className = "text-button copy-button";
    copyButton.textContent = "Copy token";

    panel.className = "qr-panel hidden";
    panel.append("Show this QR code to the operator.", qr);

    qrButton.onclick = () => {
        const hidden = panel.classList.toggle("hidden");

        if (!hidden && !qr.hasChildNodes()) {
            new QRCode(qr, {
                text: token.token_code,
                width: 210,
                height: 210
            });
        }

        qrButton.textContent = hidden
            ? "View QR code"
            : "Hide QR code";
    };

    copyButton.onclick = async () => {
        try {
            await navigator.clipboard.writeText(token.token_code);
            copyButton.textContent = "Copied!";

            setTimeout(() => {
                copyButton.textContent = "Copy token";
            }, 1600);

        } catch (error) {
            showMessage(
                "Copy is not available in this browser. Please enter the code manually.",
                "error"
            );
        }
    };

    actions.append(qrButton, copyButton);

    if (getEffectiveStatus(token) === "WAITING") {
        const cancelButton = document.createElement("button");

        cancelButton.type = "button";
        cancelButton.className = "text-button danger-button";
        cancelButton.textContent = "Cancel token";
        cancelButton.onclick = () => cancelToken(token.token_code);

        actions.append(cancelButton);
    }

    details.append(actions, panel);
    detailsInner.appendChild(details);
    detailsWrapper.appendChild(detailsInner);

    item.append(header, detailsWrapper);

    return item;
}

function render() {
    const statusCounts = {
        ACTIVE: 0,
        USED: 0,
        CANCELLED: 0,
        EXPIRED: 0
    };

    tokens.forEach(token => {
        const category = getStatusInfo(
            getEffectiveStatus(token)
        ).category;

        if (Object.prototype.hasOwnProperty.call(statusCounts, category)) {
            statusCounts[category]++;
        }
    });

    document.getElementById("activeTokenCount").textContent =
        statusCounts.ACTIVE;

    document.getElementById("usedTokenCount").textContent =
        statusCounts.USED;

    document.getElementById("cancelledTokenCount").textContent =
        statusCounts.CANCELLED;

    document.getElementById("expiredTokenCount").textContent =
        statusCounts.EXPIRED;

    const shown = tokens.filter(token => {
        if (!filter.value) return true;

        return getStatusInfo(
            getEffectiveStatus(token)
        ).category === filter.value;
    });

    count.textContent =
        shown.length + " of " + tokens.length +
        " token" + (tokens.length === 1 ? "" : "s");

    list.replaceChildren();

    if (!shown.length) {
        list.innerHTML = `
            <div class="card empty-state">
                <div class="empty-icon">▦</div>
                <h3>No matching tokens</h3>
                <p>Change the filter or create a fuel token when you are ready to refuel.</p>
            </div>`;

        return;
    }

    shown.forEach(token => list.appendChild(card(token)));
}

async function loadTokens() {
    list.innerHTML = `
        <div class="card empty-state">
            <div class="empty-icon">◌</div>
            <p>Loading your tokens…</p>
        </div>`;

    try {
        const response = await fetch("/api/customer/transactions");

        if (response.status === 401) {
            window.location.href = "/customer-login";
            return;
        }

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not load tokens.");
        }

        tokens = Array.isArray(data) ? data : [];
        render();

    } catch (error) {
        count.textContent = "Could not load tokens";

        list.innerHTML = `
            <div class="card empty-state">
                <div class="empty-icon">!</div>
                <p>Could not load your tokens. Please refresh and try again.</p>
            </div>`;
    }
}

// Fuel token creation
document.getElementById("tokenForm").addEventListener("submit", async event => {
    event.preventDefault();

    const form = event.currentTarget;
    const button = document.getElementById("generateButton");

    button.disabled = true;
    button.textContent = "Generating…";

    try {
        const response = await fetch("/api/tokens", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                vehicle_number: document.getElementById("vehicleNumber").value.trim(),
                fuel_type: document.getElementById("fuelType").value,
                amount: document.getElementById("amount").value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Unable to generate token.");
        }

        form.reset();

        showMessage(
            "Fuel token created. Your QR code is ready below.",
            "success"
        );

        await loadTokens();

    } catch (error) {
        showMessage(
            error.message || "Unable to connect to the server.",
            "error"
        );

    } finally {
        button.disabled = false;
        button.textContent = "Generate Fuel Token";
    }
});

document.getElementById("refreshButton").onclick = loadTokens;
filter.onchange = render;

loadTokens();
setInterval(updateCountdowns, 1000);
</script>

</body>
</html>
