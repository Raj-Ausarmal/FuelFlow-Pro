<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Tokens | FuelFlow Pro</title><link rel="stylesheet" href="{{ url_for('static', filename='customer.css') }}"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body><div class="app-shell">
<header class="topbar"><a class="brand" href="/customer-dashboard"><span class="brand-mark">⛽</span>FuelFlow Pro</a><div class="topbar-actions"><a class="icon-button" href="/customer-support" aria-label="Help">?</a><a class="icon-button" href="/customer-logout" aria-label="Logout">↪</a></div></header>
<main class="page"><p class="eyebrow">Fuel on your terms</p><h1>My Fuel Tokens</h1><p class="muted">Create a token, then show its QR code to the operator.</p>
<section class="section card form-card"><h2>Create a fuel token</h2><div id="formMessage" class="message" role="status"></div><form id="tokenForm"><div class="form-grid"><div class="field"><label for="vehicleNumber">Vehicle Number</label><input id="vehicleNumber" placeholder="Example: MH20AB1234" required></div><div class="field"><label for="fuelType">Fuel Type</label><select id="fuelType" required><option value="">Select fuel type</option><option value="PETROL">PETROL</option><option value="DIESEL">DIESEL</option></select></div></div><div class="field"><label for="amount">Amount (₹)</label><input id="amount" type="number" min="1" step="0.01" placeholder="Enter amount" required></div><button id="generateButton" class="button full" type="submit">Generate Fuel Token</button></form></section>
<section class="section"><div class="section-heading"><h2>Your Tokens</h2><button class="text-button" id="refreshButton">Refresh</button></div><div id="tokenList" class="token-list"><div class="card empty-state"><div class="empty-icon">◌</div><p>Loading your tokens…</p></div></div></section>
</main><nav class="bottom-nav" aria-label="Customer navigation"><a href="/customer-dashboard"><span class="nav-icon">⌂</span>Home</a><a class="active" href="/customer-tokens"><span class="nav-icon">▦</span>Tokens</a><a href="/customer-history"><span class="nav-icon">◷</span>History</a><a href="/customer-profile"><span class="nav-icon">◉</span>Profile</a></nav></div>
<script>
const tokenList=document.getElementById("tokenList"), formMessage=document.getElementById("formMessage");
function message(text,type){formMessage.textContent=text;formMessage.className="message "+type;}
function money(value){return "₹"+Number(value||0).toLocaleString("en-IN",{maximumFractionDigits:2});}
function date(value){if(!value)return "—";const parsed=new Date(value);return Number.isNaN(parsed.getTime())?value:parsed.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});}
function badge(status){const node=document.createElement("span");node.className="badge badge-"+String(status||"UNKNOWN").toUpperCase().replace(/[^A-Z0-9_-]/g,"");node.textContent=status||"UNKNOWN";return node;}
function createTokenCard(token){const card=document.createElement("article");card.className="card token-card";const main=document.createElement("div");main.className="token-card-main";const top=document.createElement("div");top.className="token-top";const title=document.createElement("div");title.innerHTML="<small class='muted'>FUEL TOKEN</small>";const code=document.createElement("div");code.className="token-code";code.textContent=token.token_code;title.appendChild(code);top.append(title,badge(token.status));const meta=document.createElement("div");meta.className="token-meta";[["Fuel",token.fuel_type||"—"],["Amount",money(token.amount)],["Vehicle",token.vehicle_number||"—"],["Created",date(token.created_at)]].forEach(pair=>{const cell=document.createElement("div");const label=document.createElement("small");label.textContent=pair[0];const value=document.createElement("strong");value.textContent=pair[1];cell.append(label,value);meta.appendChild(cell);});main.append(top,meta);const actions=document.createElement("div");actions.className="token-actions";const qrButton=document.createElement("button");qrButton.className="text-button";qrButton.textContent="View QR code";const panel=document.createElement("div");panel.className="qr-panel hidden";const qr=document.createElement("div");panel.append(document.createTextNode("Show this QR code to the operator."),qr);qrButton.addEventListener("click",()=>{const hidden=panel.classList.toggle("hidden");if(!hidden&&!qr.hasChildNodes())new QRCode(qr,{text:token.token_code,width:210,height:210});qrButton.textContent=hidden?"View QR code":"Hide QR code";});actions.append(qrButton);card.append(main,actions,panel);return card;}
function renderTokens(tokens){tokenList.replaceChildren();if(!tokens.length){tokenList.innerHTML='<div class="card empty-state"><div class="empty-icon">▦</div><h3>No fuel tokens yet</h3><p>Create your first token above when you are ready to refuel.</p></div>';return;}tokens.forEach(token=>tokenList.appendChild(createTokenCard(token)));}
async function loadTokens(){tokenList.innerHTML='<div class="card empty-state"><div class="empty-icon">◌</div><p>Loading your tokens…</p></div>';try{const response=await fetch("/api/customer/transactions");if(response.status===401){window.location.href="/customer-login";return;}const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not load tokens.");renderTokens(Array.isArray(data)?data:[]);}catch(error){tokenList.innerHTML='<div class="card empty-state"><div class="empty-icon">!</div><p>Could not load your tokens. Please refresh and try again.</p></div>';}}
document.getElementById("tokenForm").addEventListener("submit",async event=>{event.preventDefault();const form=event.currentTarget;const button=document.getElementById("generateButton");button.disabled=true;button.textContent="Generating…";message("","error");try{const response=await fetch("/api/tokens",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vehicle_number:document.getElementById("vehicleNumber").value.trim(),fuel_type:document.getElementById("fuelType").value,amount:document.getElementById("amount").value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to generate token.");form.reset();message("Fuel token created. Your QR code is ready below.","success");await loadTokens();}catch(error){message(error.message||"Unable to connect to the server.","error");}finally{button.disabled=false;button.textContent="Generate Fuel Token";}});
document.getElementById("refreshButton").addEventListener("click",loadTokens);loadTokens();
</script></body></html>
