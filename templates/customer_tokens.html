<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Tokens | FuelFlow Pro</title><link rel="stylesheet" href="{{ url_for('static', filename='customer.css') }}"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body><div class="app-shell"><header class="topbar"><a class="brand" href="/customer-dashboard"><span class="brand-mark">⛽</span>FuelFlow Pro</a><div class="topbar-actions"><a class="icon-button" href="/customer-support" aria-label="Help">?</a><a class="icon-button" href="/customer-logout" aria-label="Logout">↪</a></div></header>
<main class="page"><p class="eyebrow">Fuel on your terms</p><h1>My Fuel Tokens</h1><p class="muted">Create a token, then show its QR code to the operator.</p><section class="section card form-card"><h2>Create a fuel token</h2><div id="formMessage" class="message" role="status"></div><form id="tokenForm"><div class="form-grid"><div class="field"><label for="vehicleNumber">Vehicle Number</label><input id="vehicleNumber" placeholder="Example: MH20AB1234" required></div><div class="field"><label for="fuelType">Fuel Type</label><select id="fuelType" required><option value="">Select fuel type</option><option value="PETROL">PETROL</option><option value="DIESEL">DIESEL</option></select></div></div><div class="field"><label for="amount">Amount (₹)</label><input id="amount" type="number" min="1" step="0.01" placeholder="Enter amount" required></div><button id="generateButton" class="button full" type="submit">Generate Fuel Token</button></form></section><section class="section"><div class="section-heading"><h2>Your Tokens</h2><button class="text-button" id="refreshButton">Refresh</button></div><div class="token-toolbar"><span id="tokenCount" class="token-count">Loading tokens…</span><select id="tokenStatusFilter" aria-label="Filter tokens by status"><option value="">All statuses</option><option value="WAITING">Waiting</option><option value="AUTHORIZED">Authorized</option><option value="EXPIRED">Completed</option><option value="CANCELLED">Cancelled</option></select></div><div id="tokenList" class="token-list"></div></section></main><nav class="bottom-nav" aria-label="Customer navigation"><a href="/customer-dashboard"><span class="nav-icon">⌂</span>Home</a><a class="active" href="/customer-tokens"><span class="nav-icon">▦</span>Tokens</a><a href="/customer-history"><span class="nav-icon">◷</span>History</a><a href="/customer-profile"><span class="nav-icon">◉</span>Profile</a></nav></div>
<script>
const vehicleInput=document.getElementById("vehicleNumber"),vehicleField=vehicleInput.closest(".field"),savedVehicleField=document.createElement("div"),savedVehicleLabel=document.createElement("label"),savedVehicleSelect=document.createElement("select");savedVehicleField.className="field";savedVehicleLabel.htmlFor="savedVehicle";savedVehicleLabel.textContent="Saved Vehicles";savedVehicleSelect.id="savedVehicle";savedVehicleSelect.innerHTML='<option value="">Type a new vehicle below</option>';savedVehicleField.append(savedVehicleLabel,savedVehicleSelect);vehicleField.parentNode.insertBefore(savedVehicleField,vehicleField);savedVehicleSelect.addEventListener("change",()=>{if(savedVehicleSelect.value)vehicleInput.value=savedVehicleSelect.value;});async function loadSavedVehicles(){try{const response=await fetch("/api/customer/vehicles");if(!response.ok)return;const vehicles=await response.json();vehicles.forEach(vehicle=>{const option=document.createElement("option");option.value=vehicle.vehicle_number;option.textContent=vehicle.vehicle_number;savedVehicleSelect.appendChild(option);});}catch(error){}}loadSavedVehicles();
</script>
<script>
const list=document.getElementById("tokenList"),messageBox=document.getElementById("formMessage"),count=document.getElementById("tokenCount"),filter=document.getElementById("tokenStatusFilter");let tokens=[];
const money=value=>"₹"+Number(value||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const date=value=>{if(!value)return "—";const parsed=new Date(value);return Number.isNaN(parsed.getTime())?value:parsed.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});};
function showMessage(text,type){messageBox.textContent=text;messageBox.className="message "+type;}function makeBadge(status){const badge=document.createElement("span");badge.className="badge badge-"+String(status||"UNKNOWN").replace(/[^A-Z0-9_-]/g,"");badge.textContent=status||"UNKNOWN";return badge;}
async function cancelToken(code){if(!confirm("Cancel this waiting fuel token? It cannot be scanned after cancellation."))return;try{const response=await fetch("/api/customer/tokens/"+encodeURIComponent(code)+"/cancel",{method:"POST"});const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not cancel token.");showMessage(data.message,"success");await loadTokens();}catch(error){showMessage(error.message||"Could not cancel token.","error");}}
function card(token){const item=document.createElement("article"),main=document.createElement("div"),top=document.createElement("div"),title=document.createElement("div"),code=document.createElement("div"),meta=document.createElement("div"),actions=document.createElement("div");item.className="card token-card";main.className="token-card-main";top.className="token-top";code.className="token-code";code.textContent=token.token_code;title.innerHTML="<small class='muted'>FUEL TOKEN</small>";title.appendChild(code);top.append(title,makeBadge(token.status));meta.className="token-meta";[["Fuel",token.fuel_type||"—"],["Amount",money(token.amount)],["Vehicle",token.vehicle_number||"—"],["Created",date(token.created_at)]].forEach(([label,value])=>{const cell=document.createElement("div");cell.innerHTML="<small></small><strong></strong>";cell.querySelector("small").textContent=label;cell.querySelector("strong").textContent=value;meta.appendChild(cell);});main.append(top,meta);actions.className="token-actions";const qrButton=document.createElement("button"),copyButton=document.createElement("button"),panel=document.createElement("div"),qr=document.createElement("div");qrButton.className="text-button";qrButton.textContent="View QR code";copyButton.className="text-button copy-button";copyButton.textContent="Copy code";panel.className="qr-panel hidden";panel.append("Show this QR code to the operator.",qr);qrButton.onclick=()=>{const hidden=panel.classList.toggle("hidden");if(!hidden&&!qr.hasChildNodes())new QRCode(qr,{text:token.token_code,width:210,height:210});qrButton.textContent=hidden?"View QR code":"Hide QR code";};copyButton.onclick=async()=>{try{await navigator.clipboard.writeText(token.token_code);copyButton.textContent="Copied";setTimeout(()=>copyButton.textContent="Copy code",1600);}catch(error){showMessage("Copy is not available in this browser. Please enter the code manually.","error");}};actions.append(qrButton,copyButton);if(token.status==="WAITING"){const cancelButton=document.createElement("button");cancelButton.className="text-button danger-button";cancelButton.textContent="Cancel token";cancelButton.onclick=()=>cancelToken(token.token_code);actions.append(cancelButton);}item.append(main,actions,panel);return item;}
function render(){const shown=tokens.filter(token=>!filter.value||token.status===filter.value);count.textContent=shown.length+" of "+tokens.length+" token"+(tokens.length===1?"":"s");list.replaceChildren();if(!shown.length){list.innerHTML='<div class="card empty-state"><div class="empty-icon">▦</div><h3>No matching tokens</h3><p>Change the filter or create a fuel token when you are ready to refuel.</p></div>';return;}shown.forEach(token=>list.appendChild(card(token)));}
async function loadTokens(){list.innerHTML='<div class="card empty-state"><div class="empty-icon">◌</div><p>Loading your tokens…</p></div>';try{const response=await fetch("/api/customer/transactions");if(response.status===401){window.location.href="/customer-login";return;}const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not load tokens.");tokens=Array.isArray(data)?data:[];render();}catch(error){count.textContent="Could not load tokens";list.innerHTML='<div class="card empty-state"><div class="empty-icon">!</div><p>Could not load your tokens. Please refresh and try again.</p></div>';}}
document.getElementById("tokenForm").addEventListener("submit",async event=>{event.preventDefault();const form=event.currentTarget,button=document.getElementById("generateButton");button.disabled=true;button.textContent="Generating…";try{const response=await fetch("/api/tokens",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vehicle_number:document.getElementById("vehicleNumber").value.trim(),fuel_type:document.getElementById("fuelType").value,amount:document.getElementById("amount").value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to generate token.");form.reset();showMessage("Fuel token created. Your QR code is ready below.","success");await loadTokens();}catch(error){showMessage(error.message||"Unable to connect to the server.","error");}finally{button.disabled=false;button.textContent="Generate Fuel Token";}});document.getElementById("refreshButton").onclick=loadTokens;filter.onchange=render;loadTokens();
</script></body></html>
