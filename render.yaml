services:
  - type: web
    name: fuelflow-pro
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/fuelflow.db
    disk:
      name: fuelflow-data
      mountPath: /var/data
      sizeGB: 1
